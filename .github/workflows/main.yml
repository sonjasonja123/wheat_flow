name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  backend-test:
    runs-on: ubuntu-latest

    steps: 
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
      
      - name: Install backend dependencies
        run: |
          cd backend
          npm install
        
      
      - name: Run backend tests
        run: |
          cd backend
          npm test

          
  frontend-test:
    runs-on: ubuntu-latest

    steps: 
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
      
      - name: Install frontened dependencies
        run: |
          cd frontend
          npm install
        
      
      - name: Run frontend tests
        run: |
          cd frontend
          npm test        
      
  docker:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKER_USERNAME }}" | docker login -u "${{ secrets.DOCKER_PASSWORD }}" --password-stdin

      - name: Build backend Docker image
        run: |
          docker build -t katarinak22/internet-tehnologije-2025-poljoprivredna_proizvodnja-backend:${{ github.sha }} ./backend

      - name: Push backend image
        run: |
          docker push katarinak22/internet-tehnologije-2025-poljoprivredna_proizvodnja-backend:${{ github.sha }}
      
      - name: Build frontend Docker image
        run: |
          docker build -t katarinak22/internet-tehnologije-2025-poljoprivredna_proizvodnja-frontend:${{ github.sha }} ./frontend

      - name: Push frontend image
        run: |
          docker push katarinak22/internet-tehnologije-2025-poljoprivredna_proizvodnja-frontend:${{ github.sha }}
      
    
