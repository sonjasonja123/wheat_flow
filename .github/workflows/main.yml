name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    runs-on: ubuntu-latest

    steps: 
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      
      - name: Install backend dependencies
        run: |
          cd backend
          npm ci
        
      
      - name: Run backend tests
        run: |
          cd backend
          npm test

          
  frontend-test:
    runs-on: ubuntu-latest

    steps: 
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      
      - name: Install frontened dependencies
        run: |
          cd frontend
          npm ci
        
      
      - name: Run frontend tests
        run: |
          cd frontend
          npm run build
      
  docker:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Docker images
        run: docker compose build
      
    
